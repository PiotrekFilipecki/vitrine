<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Q0 · dither sheet: background raster per variant</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #f1ece2;
        color: #151311;
        font:
          12px/1.3 ui-monospace,
          Menlo,
          monospace;
      }
      .row {
        display: grid;
        grid-template-columns: 220px repeat(12, 120px);
        gap: 4px;
        align-items: start;
        margin-bottom: 6px;
      }
      .label {
        padding-top: 4px;
      }
      .label b {
        display: block;
        font-size: 13px;
      }
      vitrine-shader {
        display: block;
        width: 120px;
        height: 144px;
        outline: 1px solid #151311;
      }
      vitrine-shader img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .share {
        font-size: 11px;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div id="sheet"></div>
    <script type="module">
      import '/packages/element/dist/index.js';

      // Each row: one parameter set on all 12 NIWWTS mockups. Measured: share of ground pixels (the cream mockup ground,
      // source luminance 0.927 ± 0.015; frames, mats and anti-aliased edges excluded) whose baked colour differs from
      // paper #f1ece2 by more than 8 on any channel. 0 % = clean paper.
      const q = new URLSearchParams(location.search);
      const rows = JSON.parse(
        q.get('rows') ??
          JSON.stringify([
            { label: 'v0.1 newsprint', note: '8×8, size 2, 3 steps', params: {} },
            { label: 'whitePoint 0.9', note: 'newsprint + whitePoint', params: { whitePoint: 0.9 } },
          ])
      );
      const files = [
        '01-tee-el-funkador',
        '02-print-uptown-saturday-descent',
        '03-tee-molnar',
        '04-print-opart_accent',
        '05-tee-the-hustle-recursive',
        '06-print-flow',
        '07-tee-bauhaus_accent',
        '08-print-faded-in-studio-54',
        '09-tee-ollie',
        '10-print-kredki-warm',
        '11-tee-mothership-reflection',
        '12-print-type_accent',
      ];
      const PAPER = [0xf1, 0xec, 0xe2];
      const sheet = document.getElementById('sheet');
      const result = { rows: [], done: false };
      window.__sheet = result;

      function pixels(img, w, h) {
        const c = document.createElement('canvas');
        c.width = w;
        c.height = h;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, w, h);
        return ctx.getImageData(0, 0, w, h).data;
      }

      // Rows run one after another: the bake cache holds 96 entries and a whole sheet is 132 cards.
      async function runRow(row) {
        const el = document.createElement('div');
        el.className = 'row';
        el.innerHTML = `<div class="label"><b>${row.label}</b>${row.note ?? ''}<div class="mean"></div></div>`;
        const cells = [];
        for (const f of files) {
          const cell = document.createElement('div');
          const v = document.createElement('vitrine-shader');
          v.setAttribute('effect', 'dither');
          v.setAttribute('preset', row.preset ?? 'newsprint');
          v.setAttribute('params', JSON.stringify(row.params ?? {}));
          const img = new Image(1600, 1920);
          img.src = `/examples/spikes/fixtures/${f}.webp`;
          img.alt = '';
          v.appendChild(img);
          const share = document.createElement('div');
          share.className = 'share';
          cell.append(v, share);
          el.appendChild(cell);
          cells.push(
            new Promise((resolve) =>
              v.addEventListener('vitrine:ready', () => resolve({ v, img, share, f }), { once: true })
            )
          );
        }
        sheet.appendChild(el);
        await Promise.all(cells).then(async (done) => {
          const shares = [];
          for (const { v, img, share, f } of done) {
            const baked = v.querySelector('.vitrine-layer > img');
            // Already decoded by the element; its object URL may be revoked by the LRU cache (96) on a big sheet.
            const w = baked.naturalWidth;
            const h = baked.naturalHeight;
            const b = pixels(baked, w, h);
            const s = pixels(img, w, h);
            // Ground mask, eroded by 3 px so pixels touching the product (resampled edges, soft shadow) do not count.
            const ground = new Uint8Array(w * h);
            for (let i = 0, p = 0; i < s.length; i += 4, p++) {
              const lum = (0.2126 * s[i] + 0.7152 * s[i + 1] + 0.0722 * s[i + 2]) / 255;
              ground[p] = Math.abs(lum - 0.927) <= 0.015 ? 1 : 0;
            }
            const R = 3;
            const isGround = (x, y) =>
              ground[y * w + x] &&
              ground[y * w + Math.max(0, x - R)] &&
              ground[y * w + Math.min(w - 1, x + R)] &&
              ground[Math.max(0, y - R) * w + x] &&
              ground[Math.min(h - 1, y + R) * w + x];
            let bg = 0;
            let dirty = 0;
            let ink = 0;
            for (let y = 0; y < h; y++) {
              for (let x = 0; x < w; x++) {
                const i = (y * w + x) * 4;
                const off =
                  Math.abs(b[i] - PAPER[0]) > 8 ||
                  Math.abs(b[i + 1] - PAPER[1]) > 8 ||
                  Math.abs(b[i + 2] - PAPER[2]) > 8;
                if (isGround(x, y)) {
                  bg += 1;
                  if (off) dirty += 1;
                } else if (off) ink += 1;
              }
            }
            const pct = +((100 * dirty) / Math.max(1, bg)).toFixed(2);
            share.textContent = `${pct} %`;
            shares.push({
              file: f,
              bgPixels: bg,
              dirtyPct: pct,
              inkPixelsOnProduct: ink,
              baked: `${w}x${h}`,
            });
          }
          const mean = +(shares.reduce((a, x) => a + x.dirtyPct, 0) / shares.length).toFixed(2);
          el.querySelector('.mean').textContent = `background raster: mean ${mean} %`;
          result.rows.push({ ...row, meanDirtyPct: mean, cards: shares });
        });
      }
      (async () => {
        for (const row of rows) await runRow(row);
      })()
        .then(() => (result.done = true))
        .catch((e) => {
          result.error = String(e);
          result.done = true;
        });
    </script>
  </body>
</html>
