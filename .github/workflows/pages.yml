# Q0 · B7: publishes the static demo (examples/static) to GitHub Pages.
# Works once the repo is public (Pages on a private repo needs a paid plan) and Settings → Pages → Source is set to
# "GitHub Actions". No secrets. Actions are pinned to commit SHAs (exact pins, CLAUDE.md); the tag is in the comment.
name: Pages (static demo)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Skipped (not failed) while the repo is private; runs on the first push after it goes public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.5.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Element + React wrappers + the single-file theme asset; the Next example is not part of the static site.
      - run: pnpm -r --filter "./packages/*" run build && node scripts/assemble-react.mjs
      - run: pnpm build:theme
      - run: pnpm test
      - run: node scripts/pages-site.mjs _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}examples/static/
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
